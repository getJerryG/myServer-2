# Redis配置文件

# 绑定地址，生产环境建议绑定特定IP
bind 0.0.0.0

# 端口号
port 6379

# 密码，生产环境必须设置强密码
# requirepass your_strong_password

# 最大内存限制
maxmemory 2gb

# 内存淘汰策略，当内存使用超过maxmemory时
maxmemory-policy volatile-lru

# RDB持久化配置
save 3600 10    # 3600秒内有10个键被修改时保存
save 300 100     # 300秒内有100个键被修改时保存
save 60 10000    # 60秒内有10000个键被修改时保存

# RDB文件名称
dbfilename dump.rdb

# RDB文件存储路径
dir ./redis-data

# 启用RDB压缩
rdbcompression yes

# 启用RDB校验
rdbchecksum yes

# AOF持久化配置
appendonly yes      # 启用AOF持久化
appendfilename "appendonly.aof"  # AOF文件名称
appendfsync everysec  # 每秒同步一次，平衡性能和数据安全性

# 重写时不阻塞AOF写入
no-appendfsync-on-rewrite yes

# AOF文件大小增长100%时重写
auto-aof-rewrite-percentage 100

# AOF文件最小重写大小
auto-aof-rewrite-min-size 64mb

# 启用混合持久化（Redis 4.0+）
aof-use-rdb-preamble yes

# 连接超时时间
 timeout 300

# 最大客户端连接数
maxclients 10000

# 日志级别
loglevel notice

# 日志文件
logfile "redis.log"
